[package]
name = "rpengine-manager"
version = "0.1.0"
description = "Desktop manager for RPEngine"
authors = ["RPEngine Manager contributors"]
edition = "2021"

[lib]
name = "rpengine_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
