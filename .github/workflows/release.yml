name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Signed Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Verify release version and tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run version:check
      - run: npm run version:test
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run rust:fmt
      - run: npm run rust:lint
      - run: npm run rust:test
      - run: npm run build
      - name: Require updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw "TAURI_SIGNING_PRIVATE_KEY is required for signed releases." }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required for signed releases." }
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: RPEngine Manager ${{ github.ref_name }}
          releaseBody: Signed RPEngine Manager release.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc -- --locked
      - name: Publish stable NSIS installer alias
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          $installerDirectory = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $versionedInstaller = Join-Path $installerDirectory "RPEngine.Manager_${version}_x64-setup.exe"
          $stableInstaller = Join-Path $installerDirectory "RPEngine.Manager_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $versionedInstaller -PathType Leaf)) { throw "Expected versioned NSIS installer was not created: $versionedInstaller" }
          Copy-Item -LiteralPath $versionedInstaller -Destination $stableInstaller
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $versionedInstaller).Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath $stableInstaller).Hash) { throw "Stable NSIS installer does not match the versioned installer." }
          gh release upload $env:RELEASE_TAG $stableInstaller
